name: Daily AI News

on:
  schedule:
    # Primary slot 03:00 UTC (= 07:00 Asia/Dubai), well ahead of the 05:30 UTC
    # (09:00 Dubai) newsletter send. Hourly backups through midday: GitHub's
    # Actions scheduler can delay or silently skip a single cron slot, and the
    # per-day guard below makes the extra slots harmless — they skip once
    # today's edition exists — but guarantees the edition still appears. A
    # backup that lands after 05:30 UTC still sends the email (asap fallback
    # in push_buttondown.py) rather than losing the day.
    - cron: "0 3-12 * * *"
  workflow_dispatch: {}

# Serialize runs so a backup slot never races the primary. Queued runs re-check
# the guard and skip if the edition was already published in the meantime.
concurrency:
  group: daily-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip if today's edition already published
        id: guard
        run: |
          # The edition is dated by the reader's morning (Asia/Dubai, UTC+4).
          today=$(TZ="Asia/Dubai" date +%Y-%m-%d)
          cur=$(python3 -c "import json;print(json.load(open('data/latest.json')).get('date',''))" 2>/dev/null || echo "")
          if [ "$cur" = "$today" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Edition $today already exists — skipping this backup slot."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Generating edition for $today (current committed: ${cur:-none})."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run aggregator pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python main.py

      - name: Compute newsletter send time (09:00 Dubai = 05:30 UTC)
        if: steps.guard.outputs.skip != 'true'
        id: send_at
        run: |
          # Target: 05:30 UTC today. If the run started after 05:30 (late backup
          # slot), push_buttondown.py falls back to "send as soon as possible".
          at=$(date -u -d "$(date -u +%Y-%m-%d) 05:30:00" +%Y-%m-%dT%H:%M:%SZ)
          echo "at=$at" >> "$GITHUB_OUTPUT"
          echo "Scheduling newsletter for $at"

      - name: Commit generated digest
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/daily/ data/ newsletter/
          if git diff --cached --quiet; then
            echo "No new digest to publish."
            exit 0
          fi
          git commit -m "chore(ai-news): daily digest $(TZ='Asia/Dubai' date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD

      - name: Schedule newsletter in Buttondown for 09:00 Dubai
        if: steps.guard.outputs.skip != 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_SEND_AT: ${{ steps.send_at.outputs.at }}
        run: python push_buttondown.py
