name: Daily AI News

on:
  schedule:
    # 03:00 UTC every day = 07:00 Asia/Dubai (GST, UTC+4) every morning
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run aggregator pipeline
        run: python main.py

      - name: Commit generated digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/daily/ data/ newsletter/
          if git diff --cached --quiet; then
            echo "No new digest to publish."
            exit 0
          fi
          git commit -m "chore(ai-news): daily digest $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD

      - name: Stage newsletter draft in Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python push_buttondown.py || echo 'Buttondown draft staging skipped.'
